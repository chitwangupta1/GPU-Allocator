<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Compute Marketplace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 1.1em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-button {
            flex: 1;
            padding: 15px;
            background: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tab-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .tab-button.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .tab-content.active {
            display: block;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input, select, textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
            margin-top: 20px;
            width: 100%;
        }

        .submit-btn:hover {
            transform: scale(1.02);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .listings {
            display: grid;
            gap: 20px;
            margin-top: 20px;
        }

        .listing-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .listing-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .listing-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 0.85em;
            color: #666;
            font-weight: 600;
        }

        .info-value {
            font-size: 1em;
            color: #333;
            margin-top: 2px;
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .analysis-result {
            background: #e8f4f8;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🖥️ GPU Compute Marketplace</h1>
            <p>AI-Powered Platform Connecting GPU Providers with Requesters</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="showTab('provider', event)">List GPU Resources</button>
            <button class="tab-button" onclick="showTab('requester', event)">Request GPU Time</button>
            <button class="tab-button" onclick="showTab('listings', event)">View Marketplace</button>
        </div>

        <!-- Provider Tab -->
        <div id="provider" class="tab-content active">
            <h2>List Your GPU Resources</h2>
            <form id="providerForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="p_company">Company Name *</label>
                        <input type="text" id="p_company" required>
                    </div>
                    <div class="form-group">
                        <label for="p_email">Contact Email *</label>
                        <input type="email" id="p_email" required>
                    </div>
                    <div class="form-group">
                        <label for="p_gpu_type">GPU Type *</label>
                        <select id="p_gpu_type" required>
                            <option value="">Select GPU Type</option>
                            <option value="NVIDIA A100">NVIDIA A100</option>
                            <option value="NVIDIA H100">NVIDIA H100</option>
                            <option value="NVIDIA V100">NVIDIA V100</option>
                            <option value="NVIDIA RTX 4090">NVIDIA RTX 4090</option>
                            <option value="NVIDIA A40">NVIDIA A40</option>
                            <option value="AMD MI250X">AMD MI250X</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="p_quantity">Number of GPUs *</label>
                        <input type="number" id="p_quantity" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="p_memory">GPU Memory (GB) *</label>
                        <input type="number" id="p_memory" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="p_location">Location *</label>
                        <input type="text" id="p_location" placeholder="e.g., US-East, EU-West" required>
                    </div>
                    <div class="form-group">
                        <label for="p_availability">Availability Period *</label>
                        <input type="text" id="p_availability" placeholder="e.g., 3 months, 1 year" required>
                    </div>
                    <div class="form-group">
                        <label for="p_price">Price per Hour (USD) *</label>
                        <input type="number" id="p_price" step="0.01" min="0" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="p_notes">Additional Notes</label>
                    <textarea id="p_notes" placeholder="Any special requirements, network specs, etc."></textarea>
                </div>
                <button type="submit" class="submit-btn">Submit GPU Listing</button>
            </form>
            <div id="providerStatus" class="status-message"></div>
        </div>

        <!-- Requester Tab -->
        <div id="requester" class="tab-content">
            <h2>Request GPU Compute Time</h2>
            <form id="requesterForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="r_company">Company Name *</label>
                        <input type="text" id="r_company" required>
                    </div>
                    <div class="form-group">
                        <label for="r_email">Contact Email *</label>
                        <input type="email" id="r_email" required>
                    </div>
                    <div class="form-group">
                        <label for="r_gpu_type">Preferred GPU Type *</label>
                        <select id="r_gpu_type" required>
                            <option value="">Select GPU Type</option>
                            <option value="NVIDIA A100">NVIDIA A100</option>
                            <option value="NVIDIA H100">NVIDIA H100</option>
                            <option value="NVIDIA V100">NVIDIA V100</option>
                            <option value="NVIDIA RTX 4090">NVIDIA RTX 4090</option>
                            <option value="Any High-End">Any High-End GPU</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="r_quantity">Number of GPUs Needed *</label>
                        <input type="number" id="r_quantity" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="r_duration">Duration Needed *</label>
                        <input type="text" id="r_duration" placeholder="e.g., 2 weeks, 6 months" required>
                    </div>
                    <div class="form-group">
                        <label for="r_workload">Workload Type *</label>
                        <select id="r_workload" required>
                            <option value="">Select Workload</option>
                            <option value="LLM Training">LLM Training</option>
                            <option value="Image Generation">Image Generation</option>
                            <option value="Inference">Inference</option>
                            <option value="Research">Research</option>
                            <option value="Video Processing">Video Processing</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="r_budget">Budget per Hour (USD) *</label>
                        <input type="number" id="r_budget" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="r_location">Preferred Location</label>
                        <input type="text" id="r_location" placeholder="e.g., US, EU, Asia">
                    </div>
                </div>
                <div class="form-group">
                    <label for="r_requirements">Specific Requirements</label>
                    <textarea id="r_requirements" placeholder="Additional requirements or constraints"></textarea>
                </div>
                <button type="submit" class="submit-btn">Submit Request & Find Matches</button>
            </form>
            <div id="requesterStatus" class="status-message"></div>
            <div id="analysisResult" class="analysis-result" style="display:none;"></div>
        </div>

        <!-- Listings Tab -->
        <div id="listings" class="tab-content">
            <h2>Current Marketplace</h2>
            
            <h3 style="margin-top: 30px; color: #667eea;">Available GPU Resources</h3>
            <div id="providerListings" class="listings">
                <div class="loading">Loading providers...</div>
            </div>

            <h3 style="margin-top: 40px; color: #764ba2;">GPU Requests</h3>
            <div id="requesterListings" class="listings">
                <div class="loading">Loading requests...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        function showTab(tabName, event) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'listings') {
                loadListings();
            }
        }

        document.getElementById('providerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                company_name: document.getElementById('p_company').value,
                email: document.getElementById('p_email').value,
                gpu_type: document.getElementById('p_gpu_type').value,
                quantity: parseInt(document.getElementById('p_quantity').value),
                memory_gb: parseInt(document.getElementById('p_memory').value),
                location: document.getElementById('p_location').value,
                availability: document.getElementById('p_availability').value,
                price_per_hour: parseFloat(document.getElementById('p_price').value),
                notes: document.getElementById('p_notes').value
            };

            try {
                const response = await fetch(`${API_URL}/lenders`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                const statusDiv = document.getElementById('providerStatus');
                statusDiv.className = 'status-message success';
                statusDiv.textContent = result.message;
                statusDiv.style.display = 'block';
                
                document.getElementById('providerForm').reset();
            } catch (error) {
                const statusDiv = document.getElementById('providerStatus');
                statusDiv.className = 'status-message error';
                statusDiv.textContent = 'Error submitting listing. Please try again.';
                statusDiv.style.display = 'block';
            }
        });

        document.getElementById('requesterForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                company_name: document.getElementById('r_company').value,
                email: document.getElementById('r_email').value,
                gpu_type: document.getElementById('r_gpu_type').value,
                quantity: parseInt(document.getElementById('r_quantity').value),
                duration: document.getElementById('r_duration').value,
                workload_type: document.getElementById('r_workload').value,
                budget_per_hour: parseFloat(document.getElementById('r_budget').value),
                location: document.getElementById('r_location').value,
                requirements: document.getElementById('r_requirements').value
            };

            const statusDiv = document.getElementById('requesterStatus');
            statusDiv.className = 'status-message';
            statusDiv.textContent = 'Processing your request and finding matches... This may take a moment.';
            statusDiv.style.display = 'block';

            try {
                const response = await fetch(`${API_URL}/borrowers`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                statusDiv.className = 'status-message success';
                statusDiv.textContent = result.message;
                
                if (result.analysis) {
                    const analysisDiv = document.getElementById('analysisResult');
                    analysisDiv.textContent = result.analysis;
                    analysisDiv.style.display = 'block';
                }
                
                document.getElementById('requesterForm').reset();
            } catch (error) {
                statusDiv.className = 'status-message error';
                statusDiv.textContent = 'Error processing request. Please try again.';
            }
        });

        async function loadListings() {
            try {
                // Show loading state
                document.getElementById('providerListings').innerHTML = '<div class="loading">Loading providers...</div>';
                document.getElementById('requesterListings').innerHTML = '<div class="loading">Loading requests...</div>';

                // Fetch lenders
                const providersRes = await fetch(`${API_URL}/lenders`);
                const providersData = await providersRes.json();
                console.log("LENDERS API RESPONSE:", providersData);

                // Fetch borrowers
                const requestersRes = await fetch(`${API_URL}/borrowers`);
                const requestersData = await requestersRes.json();
                console.log("BORROWERS API RESPONSE:", requestersData);

                // Display the data
                displayProviders(providersData.lenders || []);
                displayRequesters(requestersData.borrowers || []);
            } catch (error) {
                console.error('Error loading listings:', error);
                document.getElementById('providerListings').innerHTML = '<p style="text-align:center;color:#721c24;">Error loading providers. Please check if the server is running.</p>';
                document.getElementById('requesterListings').innerHTML = '<p style="text-align:center;color:#721c24;">Error loading requests. Please check if the server is running.</p>';
            }
        }

        function displayProviders(providers) {
            const container = document.getElementById('providerListings');
            if (!providers || providers.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#666;">No GPU resources listed yet.</p>';
                return;
            }

            container.innerHTML = providers.map(p => `
                <div class="listing-card">
                    <h3>${p.company_name || 'Unknown Company'}</h3>
                    <div class="listing-info">
                        <div class="info-item">
                            <span class="info-label">GPU Type</span>
                            <span class="info-value">${p.gpu_type || 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Quantity</span>
                            <span class="info-value">${p.quantity || 0} GPUs</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Available</span>
                            <span class="info-value">${p.available_gpus || 0} GPUs</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Memory</span>
                            <span class="info-value">${p.memory_gb || 0} GB</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Location</span>
                            <span class="info-value">${p.location || 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Availability</span>
                            <span class="info-value">${p.availability || 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Price</span>
                            <span class="info-value">$${p.price_per_hour || 0}/hour</span>
                        </div>
                    </div>
                    ${p.notes ? `<p style="margin-top:10px;color:#666;"><strong>Notes:</strong> ${p.notes}</p>` : ''}
                </div>
            `).join('');
        }

        function displayRequesters(requesters) {
            const container = document.getElementById('requesterListings');
            if (!requesters || requesters.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#666;">No GPU requests yet.</p>';
                return;
            }

            container.innerHTML = requesters.map(r => `
                <div class="listing-card">
                    <h3>${r.company_name || 'Unknown Company'}</h3>
                    <div class="listing-info">
                        <div class="info-item">
                            <span class="info-label">GPU Type</span>
                            <span class="info-value">${r.gpu_type || 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Quantity</span>
                            <span class="info-value">${r.quantity || 0} GPUs</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Duration</span>
                            <span class="info-value">${r.duration || 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Workload</span>
                            <span class="info-value">${r.workload_type || 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Budget</span>
                            <span class="info-value">$${r.budget_per_hour || 0}/hour</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Location</span>
                            <span class="info-value">${r.location || 'Flexible'}</span>
                        </div>
                    </div>
                    ${r.requirements ? `<p style="margin-top:10px;color:#666;"><strong>Requirements:</strong> ${r.requirements}</p>` : ''}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
